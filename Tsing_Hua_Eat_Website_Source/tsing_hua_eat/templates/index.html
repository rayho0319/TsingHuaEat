<!doctype html>
<html lang="zh-Hant">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="theme-color" content="#163d31">
    <title>清華吃 T.H.E.</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        /* 導覽列樣式 */
        .nav-links { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
        .nav-btn {
            background: transparent;
            border: 1px solid transparent;
            color: inherit;
            padding: 6px 14px;
            border-radius: 999px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.2s;
        }
        .nav-btn:hover { background: rgba(255, 255, 255, 0.15); }
        .nav-btn.active { background: var(--primary, #163d31); color: #fff; border-color: rgba(255,255,255,0.3); }
        .tab-view[hidden] { display: none !important; }

        /* 固定提示框右上角的叉叉，滾動時不滑走 */
        #modal .close {
            position: sticky;
            top: 0;
            float: right;
            z-index: 100;
            background: #fff;
            border-radius: 50%;
            width: 34px;
            height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
        }

        /* 餐廳卡片圖片樣式 */
        .food-icon { overflow: hidden; padding: 0; }
        .food-icon img { width: 100%; height: 100%; object-fit: cover; display: block; }

        /* 勾選框群組樣式 */
        .check-group {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            margin: 6px 0 14px;
        }
        .check-group label {
            display: flex;
            align-items: center;
            gap: 6px;
            margin: 0;
            font-weight: normal;
            cursor: pointer;
            font-size: 14px;
        }
        .check-group input[type="checkbox"] {
            width: auto;
            margin: 0;
        }
    </style>
</head>

<body>
    <header>
        <div class="wrap nav">
            <div class="brand" style="cursor:pointer;" onclick="switchTab('home')"><span class="logo">食</span>
                <div><strong>清華吃 <small>T.H.E.</small></strong>
                    <div class="subtitle">Tsing Hua Eat · 今天吃什麼？</div>
                </div>
            </div>
            <nav class="nav-links">
                <button class="nav-btn active" data-tab="home" onclick="switchTab('home')">首頁（篩選器）</button>
                <button class="nav-btn" data-tab="restaurants" onclick="switchTab('restaurants')">餐廳列表</button>
                <button class="nav-btn" data-tab="groups" onclick="switchTab('groups')">自訂群組</button>
            </nav>
            <div id="account"></div>
        </div>
    </header>
    <main class="wrap">
        <!-- 分頁 1：首頁（篩選器頁） -->
        <div id="tab-home" class="tab-view">
            <section class="hero">
                <div><span class="eyebrow">NTHU FOOD DISCOVERY</span>
                    <h1>今天，吃點<br><em>喜歡的。</em></h1>
                    <p>預算、口味、心情都交給你決定。<br>剩下的，讓清華吃幫你選。</p>
                    <button class="primary" onclick="switchTab('restaurants')">瀏覽餐廳列表 →</button>
                </div>
                <div class="hero-art"><span>🍜</span><span>🍱</span><span>🥗</span></div>
            </section>
            <section style="max-width: 560px; margin: 24px auto;">
                <aside class="panel filters">
                    <h3>篩選條件 <button class="link" onclick="resetFilters()">重設</button></h3>
                    <label for="search">關鍵字搜尋</label>
                    <input id="search" type="search" placeholder="輸入店名或關鍵字（如：麥、咖哩、麵）">
                    <label>最高預算 <strong id="budgetLabel">NT$ 150</strong></label>
                    <input id="budget" type="range" min="50" max="300" step="10" value="150">
                    <div class="range-label"><span>NT$ 50</span><span>NT$ 300</span></div>

                    <label>餐廳區域 <small class="muted">（不勾代表不限）</small></label>
                    <div class="check-group">
                        <label><input type="checkbox" name="area" value="小吃部"> 小吃部</label>
                        <label><input type="checkbox" name="area" value="水木餐廳"> 水木餐廳</label>
                        <label><input type="checkbox" name="area" value="風雲樓"> 風雲樓</label>
                        <label><input type="checkbox" name="area" value="其他"> 其他</label>
                    </div>

                    <label>餐點種類 <small class="muted">（不勾代表不限）</small></label>
                    <div class="check-group">
                        <label><input type="checkbox" name="category" value="麵食"> 麵食</label>
                        <label><input type="checkbox" name="category" value="飯類"> 飯類</label>
                        <label><input type="checkbox" name="category" value="輕食"> 輕食</label>
                        <label><input type="checkbox" name="category" value="速食"> 速食</label>
                    </div>

                    <label for="groupFilter">自訂群組</label>
                    <select id="groupFilter">
                        <option value="">全部餐廳</option>
                    </select>
                    <label class="check"><input id="exclude" type="checkbox" checked> 排除「不吃清單」</label>
                    <button class="primary full" onclick="randomPick()">🎲 幫我隨機選一家</button>
                    <button class="outline full" onclick="switchTab('restaurants')" style="margin-top: 10px;">📋 查看符合條件的餐廳</button>
                    <button class="outline full" onclick="showLeaderboard()" style="margin-top: 10px;">🏆 查看前 5 名熱門排行榜</button>
                    <div class="hint">登入後可以儲存個人群組、留下評價。</div>
                </aside>
            </section>
        </div>

        <!-- 分頁 2：餐廳列表 -->
        <div id="tab-restaurants" class="tab-view" hidden>
            <section id="explore">
                <div class="section-head">
                    <div><span class="eyebrow">EXPLORE</span>
                        <h2>餐廳列表</h2>
                    </div>
                    <button class="outline small" onclick="switchTab('home')">⚙️ 調整篩選條件</button>
                </div>
                <div>
                    <div class="results-head">
                        <strong id="resultCount">餐廳列表</strong>
                        <div style="display:flex; gap:8px; align-items:center;">
                            <select id="pageSize">
                                <option value="6">每頁 6 間</option>
                                <option value="12" selected>每頁 12 間</option>
                                <option value="24">每頁 24 間</option>
                                <option value="999">顯示全部</option>
                            </select>
                            <select id="sort">
                                <option value="default">預設排序</option>
                                <option value="rating">評分最高</option>
                                <option value="price">價格最低</option>
                                <option value="popular">熱門排行 ✨</option>
                            </select>
                        </div>
                    </div>
                    <div id="cards" class="cards"></div>
                    <div id="pagination" style="display:flex; justify-content:center; align-items:center; gap:12px; margin-top:20px;"></div>
                    <div id="empty" class="empty" hidden>沒有符合條件的餐廳，試著回到首頁調整條件吧！</div>
                </div>
            </section>
        </div>

        <!-- 分頁 3：自訂群組管理頁 -->
        <div id="tab-groups" class="tab-view" hidden>
            <section class="groups-section">
                <div class="section-head">
                    <div><span class="eyebrow">PERSONALIZE</span>
                        <h2>我的餐廳群組</h2>
                    </div>
                    <button class="outline" onclick="createGroup()">＋ 建立群組</button>
                </div>
                <div id="groups" class="group-list"></div>
            </section>
        </div>
    </main>
    <footer>清華吃 Tsing Hua Eat · Student project prototype · Made for exploration</footer>
    <dialog id="modal"><button class="close" onclick="modal.close()">✕</button>
        <div id="modalBody"></div>
    </dialog>
    <div id="toast" role="status"></div>
    <script src="/static/app.js"></script>
</body>

</html>
